# config.yaml — top-level Hydra composition root
defaults:
  - paths@paths
  - dataset@dataset
  - pipeline@pipeline
  - normalization@normalization: default
  - augmentation@augmentation
  - vqvae@vqvae
  - diffusion@diffusion
  - training@training
  - evaluation@evaluation
  - generation@generation
  - _self_

run_name: ${now:%Y-%m-%d_%H-%M-%S}
seed: 42
