# vqvae.yaml
model:
  in_channels: 3
  base_channels: 128
  channel_multipliers: [1, 2, 4, 4]
  num_res_blocks: 2
  latent_channels: 4
  codebook_size: 8192
  codebook_dim: 4
  commitment_cost: 0.25
  ema_decay: 0.99
  use_ema_codebook: true

loss:
  reconstruction_weight: 1.0
  perceptual_weight: 0.1
  codebook_weight: 1.0
  commitment_weight: 0.25
  perceptual_net: vgg

training:
  epochs: 200
  batch_size: 32
  lr: 2e-4
  weight_decay: 1e-4
  optimizer: adamw
  scheduler: cosine
  warmup_steps: 1000
  mixed_precision: true
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  checkpoint_every_n_epochs: 5
  log_images_every_n_steps: 200
  seed: 42

eval:
  metrics: [psnr, ssim, lpips]
  eval_every_n_epochs: 1
