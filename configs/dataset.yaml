# dataset.yaml
classes: [Normal, HP, IM, Mixed]

ingestion:
  layout: auto
  flat_class_name: Unlabeled
  flat_recursive: false
  flat_extensions: [".svs", ".tiff", ".tif", ".ndpi"]
  esd_label_mode: fine
  esd_annotation_downsample_factor: 64
  esd_min_label_fraction: 0.05
  excluded_dir_names:
    - ESD_40X_annotation_downsample64
    - ESD_40X_annotation_downsample64_xml
    - ESD_40X_thumbnail_annotation_combination
    - Components_single_308
    - ESD_40X_Thumbnail_downsample64
    - ESD_40X_Quality_Assessment_Mask

wsi:
  input_format: [".svs", ".tiff", ".ndpi", ".png", ".jpg"]
  target_magnification: 20
  base_magnification: null

patching:
  patch_size: 256
  overlap: 32
  stride: 224
  magnification: 20
  minimum_tissue_percentage: 0.4
  tissue_threshold_method: otsu

split:
  train: 0.8
  val: 0.1
  test: 0.1
  stratify_by: class
  seed: 42

dataloader:
  batch_size: 32
  num_workers: 8
  pin_memory: true
  shuffle: true
